name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: |
          python -m ruff check app heart_disease_mlop tests scripts docs/generate_report_pdf.py --select E4,E7,E9,F --ignore E402

      - name: Run tests
        run: |
          mkdir -p artifacts
          python -m pytest -q --junitxml=artifacts/pytest-results.xml

      - name: Train model
        run: |
          python -m heart_disease_mlop.train 2>&1 | tee artifacts/training.log

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlops-run-${{ github.run_id }}
          path: |
            artifacts/
            mlruns/
          if-no-files-found: warn
          retention-days: 14
